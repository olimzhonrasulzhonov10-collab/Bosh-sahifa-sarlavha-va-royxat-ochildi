<!DOCTYPE html>
<html>
    <head>
        <title>Css dan foydalanish</title>
        <style>
            button {
         background-color: red;
         }

            .yuborish-btn {
         background-color: rgb(0, 255, 30);
         }
        </style>
    </head>
    <body style="display: flex; justify-content: center; align-items: center; min-height: 100px">
        <div class="register-card">
            <form>
                <h2>Ro'yxatdan o'tish</h2>
                <label for="name">Foydalanuvchi ismi:</label><br>
                <input type="text" placeholder="Ismingizni kiriting"><br>

                <label for="tel">Telefon raqam</label><br>
                <input type="tel" id="tel-input" placeholder="+998991234567"><br>

                <input type="radio" id="erkak" name="jins" value="erkak">
                <label for="erkak">Erkak</label><br>

                <input type="radio" id="ayol" name="jins" value="ayol">
                <label for="ayol">Ayol</label><br>

                <input type="checkbox" id="shartlar">
                <label for="shartlar">Hamma shartlarga roziman</label><br>

                <button type="submit" class="yuborish-btn">Yuborish</button>
            </form>

        </div>
    </body>
</html>
